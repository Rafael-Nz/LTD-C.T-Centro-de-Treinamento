<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ativacao de conta</title>
</head>

<body style="margin:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#202124">
    <div
        style="max-width:600px;margin:0 auto;background:#141414;border-top:5px solid #dc3545;padding:24px 32px;color:#fff;font-size:24px;font-weight:700">
        CROSS <span style="color:#dc3545">C.T</span></div>
    <div style="max-width:600px;margin:0 auto;background:#fff;padding:36px 32px">
        <h1 style="font-size:24px">Ative sua conta</h1>
        <p>Ola, {{nome}}.</p>
        <p>Seu cadastro no Cross C.T foi criado. Clique no botao abaixo para ativar sua conta e definir sua senha.</p>
        <p style="text-align:center;margin:32px 0"><a href="{{link}}"
                style="display:inline-block;background:#dc3545;color:#fff;padding:14px 24px;border-radius:6px;text-decoration:none;font-weight:700">Ativar
                minha conta</a></p>
        <p style="font-size:13px;color:#6b7280">Este convite e valido por 24 horas e pode ser usado uma unica vez.</p>
        <p style="font-size:13px;color:#6b7280">Se o botao nao funcionar, copie este endereco:<br><a
                href="{{link}}">{{link}}</a></p>
    </div>
</body>

</html>
