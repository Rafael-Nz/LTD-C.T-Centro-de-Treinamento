# ==============================================================================
# Nginx - Bloco de Servidor de Produção para o Cross C.T
# ==============================================================================
#
# Diretriz de Segurança:
# A diretiva 'root' aponta EXCLUSIVAMENTE para a pasta 'public/'.
# Arquivos de infraestrutura (.env, composer.json, vendor, tools) permanecem
# fora do alcance de qualquer requisição HTTP.
# ==============================================================================

# Redirecionamento HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ctt.seudominio.com.br;
    return 301 https://$host$request_uri;
}

# Servidor Seguro HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ctt.seudominio.com.br;

    # Raiz web restrita à pasta public/
    root /var/www/ctt/public;
    index index.php index.html;

    # Certificados SSL (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/ctt.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctt.seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeçalhos de Segurança HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    server_tokens off;

    # Bloqueia acesso a arquivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueia acesso direto a templates de views
    location ^~ /views/ {
        deny all;
    }

    # Arquivos estáticos com cache longo
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Roteamento principal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento PHP via PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
        fastcgi_intercept_errors off;
    }

    # Logs
    access_log /var/log/nginx/ctt_access.log;
    error_log /var/log/nginx/ctt_error.log warn;
}
