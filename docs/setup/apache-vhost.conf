# ==============================================================================
# Apache 2.4 - VirtualHost de Produção para o Cross C.T
# ==============================================================================
#
# Diretriz de Segurança:
# O DocumentRoot aponta EXCLUSIVAMENTE para a pasta 'public/'.
# Dessa forma, pastas sensíveis (api/, admin/, tools/, docs/, vendor/) e
# arquivos de ambiente (.env, composer.json) ficam fora da raiz pública web.
# ==============================================================================

<VirtualHost *:80>
    ServerName ctt.seudominio.com.br
    ServerAdmin webmaster@seudominio.com.br

    # Redireciona todo o tráfego HTTP para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ctt.seudominio.com.br
    ServerAdmin webmaster@seudominio.com.br

    # Raiz Web restrita à pasta public/
    DocumentRoot "/var/www/ctt/public"

    # Configuração SSL
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ctt.seudominio.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ctt.seudominio.com.br/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    # Cabeçalhos de Segurança HTTP Globais
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    </IfModule>

    # Diretório Público
    <Directory "/var/www/ctt/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Bloqueia qualquer arquivo oculto (.git, .env)
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Encaminhamento para PHP-FPM (opcional / recomendado em produção)
    # <FilesMatch \.php$>
    #     SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    # Logs de acesso e erro
    ErrorLog ${APACHE_LOG_DIR}/ctt_error.log
    CustomLog ${APACHE_LOG_DIR}/ctt_access.log combined
</VirtualHost>
