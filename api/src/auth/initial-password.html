<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Senha inicial</title>
</head>

<body style="margin:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#202124">
    <div
        style="max-width:600px;margin:0 auto;background:#141414;border-top:5px solid #dc3545;padding:24px 32px;color:#fff;font-size:24px;font-weight:700">
        CROSS <span style="color:#dc3545">C.T</span>
    </div>
    <div style="max-width:600px;margin:0 auto;background:#fff;padding:36px 32px">
        <h1 style="font-size:24px">Sua senha inicial</h1>
        <p>Olá, {{nome}}.</p>
        <p>Use a senha abaixo para acessar sua conta pela primeira vez:</p>
        <p style="padding:14px;background:#f3f4f6;border-radius:6px;font-size:20px"><strong>{{senha_inicial}}</strong>
        </p>
        <p>Depois de entrar, inicie a ativação da conta na tela inicial para receber o link e redefinir sua senha.</p>
        <p style="font-size:13px;color:#6b7280">Não compartilhe esta senha com outras pessoas.</p>
    </div>
</body>

</html>
